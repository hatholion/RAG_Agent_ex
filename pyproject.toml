[project]
name = "rag-agent-ex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "docling-ibm-models>=4.0.3",
    "docling-parse>=7.22.2",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "faiss-gpu>=1.15.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]


[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['common']
